version: '3.8'

services:
  issues-wrapper:
    build:
      context: ./issues-wrapper
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - GITHUB_REPO_URL=${GITHUB_REPO_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    env_file:
      - .env
